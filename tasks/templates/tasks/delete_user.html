{% extends "tasks/base.html" %}
{% block title %}Delete User{% endblock %}
{% load i18n %}

{% block content %}
<h2>Delete User</h2>

<p>Are you sure you want to delete user <strong>{{ user_obj.username }}</strong>?</p>

<form method="POST">
  {% csrf_token %}
  <button type="submit" style="background-color:red; color:white; padding:5px 10px;">
    Yes, Delete
  </button>
  <a href="{% url 'tasks:manage_users' %}" class="btn">Cancel</a>
</form>
{% endblock %}
