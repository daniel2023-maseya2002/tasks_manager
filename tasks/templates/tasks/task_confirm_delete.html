{% extends "tasks/base.html" %}
{% load i18n %}

{% block content %}
<h2>Delete Task</h2>
<p>Are you sure you want to delete "{{ task.title }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'tasks:task_list' %}">Cancel</a>
</form>
{% endblock %}
