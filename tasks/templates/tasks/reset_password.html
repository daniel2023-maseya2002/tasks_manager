{% extends "tasks/base.html" %}
{% load static %}
{% block title %}Reset Password | Misala{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 14px;">

    <!-- Logo & Heading -->
    <div class="text-center mb-4">
      <img src="{% static 'picture/logo.png' %}" alt="Misala Logo" width="80" class="mb-3">
      <h3 class="text-primary fw-bold">Reset Your Password</h3>
      <p class="text-muted mb-0">
        Enter and confirm your new password below.
      </p>
    </div>

    <!-- Password Reset Form -->
    <form method="POST" class="mt-4">
      {% csrf_token %}

      <div class="mb-3">
        <label for="password1" class="form-label fw-semibold">New Password</label>
        <input type="password" name="password1" class="form-control form-control-lg" placeholder="Enter new password" required>
      </div>

      <div class="mb-3">
        <label for="password2" class="form-label fw-semibold">Confirm Password</label>
        <input type="password" name="password2" class="form-control form-control-lg" placeholder="Confirm new password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg">Reset Password</button>
    </form>

    <!-- Back to Login -->
    <div class="text-center mt-3">
      <p class="text-muted small">
        Remembered your password?
        <a href="{% url 'tasks:login' %}" class="fw-semibold text-decoration-none text-primary">
          Back to Login
        </a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
