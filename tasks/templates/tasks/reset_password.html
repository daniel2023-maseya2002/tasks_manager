{% load i18n %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Misala</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/reset_password.css' %}?v=1">
</head>
<body>
  <div class="background">
    <div class="dots dots-left"></div>
    <div class="dots dots-right"></div>

    <div class="card-container">
      <div class="reset-card shadow-lg text-center">
        <img src="{% static 'picture/logocolor.png' %}" alt="Misala Logo" class="logo mb-2">
        <h2 class="title">Reset Password</h2>
        <p class="subtitle">Enter and confirm your new password below.</p>

        <!-- Password Reset Form -->
        <form method="POST" id="reset-form" class="w-100">
          {% csrf_token %}
          <div class="mb-3 text-start">
            <label for="password1" class="form-label">New Password</label>
            <input type="password" id="password1" name="password1" class="form-control" placeholder="Enter new password" required>
          </div>

          <div class="mb-3 text-start">
            <label for="password2" class="form-label">Confirm Password</label>
            <input type="password" id="password2" name="password2" class="form-control" placeholder="Confirm new password" required>
          </div>

          <button type="submit" class="btn reset-btn w-100">Reset Password</button>
        </form>

        <div class="mt-3">
          <p class="text-muted small">
            Remembered your password?
            <a href="{% url 'tasks:login' %}" class="back-link">Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="{% static 'js/reset_password.js' %}"></script>
</body>
</html>
