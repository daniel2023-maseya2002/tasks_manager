{% load i18n %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP | Misala</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/verify_otp.css' %}?v=1">
</head>
<body>
  <div class="background">
    <div class="dots dots-left"></div>
    <div class="dots dots-right"></div>

    <div class="card-container">
      <div class="verify-card shadow-lg text-center">
        <img src="{% static 'picture/logocolor.png' %}" alt="Misala Logo" class="logo mb-2">
        <h2 class="title">Verify OTP</h2>
        <p class="subtitle">Enter the 6-digit code sent to your email address.</p>

        <!-- OTP Form -->
        <form method="POST" id="otp-form">
          {% csrf_token %}
          <div class="otp-inputs">
            {% for i in "123456" %}
              <input 
                type="text"
                name="otp_digit{{ forloop.counter }}"
                maxlength="1"
                class="otp-box text-center fw-bold"
                required
              >
            {% endfor %}
          </div>

          <button type="submit" class="btn verify-btn w-100">Verify OTP</button>
        </form>

        <div class="resend mt-3">
          <p class="text-muted small">
            Didn’t receive the code?
            <a href="{% url 'tasks:forgot_password' %}" class="resend-link">Resend OTP</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="{% static 'js/verify_otp.js' %}"></script>
</body>
</html>
