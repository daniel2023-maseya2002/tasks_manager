{% extends "tasks/base.html" %}
{% load static %}

{% block title %}Forgot Password | Misala{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 12px;">
    
    <div class="text-center mb-4">
      <img src="{% static 'picture/logo.png' %}" alt="Misala Logo" width="80" class="mb-3">
      <h3 class="text-primary fw-bold">Forgot Password</h3>
      <p class="text-muted">Enter your registered email, and we’ll send you an otp to reset your password.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email Address</label>
        <input 
          type="email" 
          name="email" 
          id="email" 
          class="form-control" 
          placeholder="Enter your email address" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary w-100">Send OTP</button>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'tasks:login' %}" class="text-decoration-none text-primary fw-semibold">
        ← Back to Login
      </a>
    </div>

  </div>
</div>
{% endblock %}
