{% load i18n %}
{% load widget_tweaks %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Misala</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/forgot_password.css' %}">
</head>

<body>
  <div class="background">
    <div class="dots dots-left"></div>
    <div class="dots dots-right"></div>

    <div class="card-container">
      <div class="forgot-card shadow-lg">
        <div class="text-center mb-3">
          <img src="{% static 'picture/logocolor.png' %}" alt="Misala Logo" class="logo mb-2">
          <h2 class="title">Forgot Password</h2>
          <p class="subtitle">Enter your registered email, and we’ll send you an otp to reset your password</p>
        </div>

        <form method="POST">
          {% csrf_token %}
          <div class="mb-3 text-start">
            <label for="email" class="form-label">Email Address</label>
            <input 
              type="email" 
              name="email" 
              id="email" 
              class="form-control" 
              placeholder="Enter your email address"
              required>
          </div>

          <button type="submit" class="btn send-btn w-100">Send OTP</button>
        </form>

        <div class="text-center mt-3">
          <a href="{% url 'tasks:login' %}" class="back-link">← Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'js/forgot_password.js' %}"></script>
</body>
</html>
