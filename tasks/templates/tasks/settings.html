{% extends "tasks/base.html" %}
{% block title %}Settings - TaskManager{% endblock %}
{% load i18n %}

{% block content %}
<div class="container py-4">
  <h2 class="mb-4"><i class="bi bi-gear me-2"></i>Settings</h2>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
      <label for="phone_number" class="form-label">Phone Number</label>
      <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ user.phone_number }}">
    </div>

    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <textarea class="form-control" id="address" name="address">{{ user.address }}</textarea>
    </div>

    <div class="mb-3">
      <label for="bio" class="form-label">Bio</label>
      <textarea class="form-control" id="bio" name="bio">{{ user.bio }}</textarea>
    </div>

    <div class="mb-3">
      <label for="profile_picture" class="form-label">Profile Picture</label>
      <input class="form-control" type="file" id="profile_picture" name="profile_picture">
      {% if user.profile_picture %}
        <img src="{{ user.profile_picture.url }}" alt="Profile Picture" class="mt-2" width="100">
      {% endif %}
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="email_notifications" name="email_notifications" {% if user.email_notifications %}checked{% endif %}>
      <label class="form-check-label" for="email_notifications">
        Receive email notifications
      </label>
    </div>

    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>
</div>
{% endblock %}
